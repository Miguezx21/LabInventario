# Configuracion SOLO para las pruebas.
# Al existir este archivo en src/test/resources, reemplaza al application.properties
# principal: los tests usan una base H2 en memoria (la que detecta Spring Boot
# automaticamente) y NO necesitan que MySQL este instalado ni encendido.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
