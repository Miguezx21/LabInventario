spring.application.name=labinventario

# ---------------------------------------------------------------
# Base de datos MySQL
# Cada valor se puede cambiar con una variable de entorno
# (DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD) o, mas simple,
# copiando application-local.properties.example a
# application-local.properties (ese archivo NO se sube a Git).
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:labinventario}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate crea/actualiza las tablas a partir de las entidades @Entity.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false
server.port=8080

# Configuracion personal opcional (contrasena de MySQL, etc.)
spring.config.import=optional:classpath:application-local.properties
