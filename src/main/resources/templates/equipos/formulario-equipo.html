<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Equipo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4" style="max-width: 600px;">

    <h1 class="h4 mb-3" th:text="${equipo.id} != null ? 'Editar equipo' : 'Nuevo equipo'"></h1>

    <!-- th:object ata el formulario completo al Equipo que envio el Controller.
         Cada campo usa th:field, que Thymeleaf traduce a name/id/value automaticamente. -->
    <form th:action="@{/equipos/guardar}" th:object="${equipo}" method="post">

        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control">
            <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Codigo de inventario</label>
            <input type="text" th:field="*{codigoInventario}" class="form-control">
            <div class="text-danger small" th:if="${#fields.hasErrors('codigoInventario')}" th:errors="*{codigoInventario}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Categoria</label>
            <select th:field="*{categoria}" class="form-select">
                <option th:each="c : ${categorias}" th:value="${c}" th:text="${c}"></option>
            </select>
            <div class="text-danger small" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Estado</label>
            <select th:field="*{estado}" class="form-select">
                <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"></option>
            </select>
            <div class="text-danger small" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Cantidad</label>
            <input type="number" th:field="*{cantidad}" class="form-control" min="0">
            <div class="text-danger small" th:if="${#fields.hasErrors('cantidad')}" th:errors="*{cantidad}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Ubicacion</label>
            <input type="text" th:field="*{ubicacion}" class="form-control">
            <div class="text-danger small" th:if="${#fields.hasErrors('ubicacion')}" th:errors="*{ubicacion}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/equipos}" class="btn btn-link">Cancelar</a>
    </form>
</div>
</body>
</html>
