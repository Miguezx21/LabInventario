<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión - LabInventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 420px;">

    <h1 class="h3 text-center mb-1">LabInventario</h1>
    <p class="text-center text-muted mb-4">Inventario del Laboratorio de Ingeniería de Software</p>

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <!-- Spring Security redirige a /login?error o /login?logout; aquí solo se muestran los avisos. -->
            <div class="alert alert-danger" th:if="${param.error}">Usuario o contraseña incorrectos.</div>
            <div class="alert alert-success" th:if="${param.logout}">Cerraste sesión correctamente.</div>

            <!-- th:action agrega solo el token CSRF oculto que exige Spring Security. -->
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="username">Usuario</label>
                    <input type="text" id="username" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
